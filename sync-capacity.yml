name: Sync capacity data from Google Sheet

on:
  # Runs weekdays, 30 min after Jarvis/OpenClaw's 6:00am AEST Cliniko pull,
  # giving it time to finish writing the Capacity tab first.
  #
  # NOTE ON TIMEZONES: GitHub Actions cron runs in UTC and does not adjust
  # for Australian daylight saving. 6:30am AEST (UTC+10, standard time,
  # roughly Apr-Oct) = 20:30 UTC the day before. When AEDT (UTC+11) is in
  # effect (roughly Oct-Apr), this will actually fire at 7:30am local time
  # instead of 6:30am — an hour late, not early, so it's a minor drift
  # rather than a broken run. Worth revisiting the cron line at each DST
  # change if exact timing matters.
  schedule:
    - cron: '30 20 * * 0-4'   # Sun-Thu 20:30 UTC = Mon-Fri 6:30am AEST
  workflow_dispatch: {}        # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild clinicians.json from the Sheet
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SHEET_ID: ${{ secrets.CAPACITY_SHEET_ID }}
        run: python3 scripts/build_clinicians.py

      - name: Commit and push if data changed
        run: |
          git config user.name "capacity-sync-bot"
          git config user.email "actions@github.com"
          git add data/clinicians.json data/match-report.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-sync capacity data from Google Sheet"
            git push
          fi
